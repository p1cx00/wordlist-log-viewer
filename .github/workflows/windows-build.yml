name: Windows build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release
        shell: powershell
        run: .\scripts\build.ps1 -Configuration Release

      - name: Run tests
        shell: powershell
        run: .\scripts\test.ps1

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordlistViewer-Windows-x64
          path: build/Release/WordlistViewer.exe
          if-no-files-found: error

