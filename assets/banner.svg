<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Wordlist and Log Viewer</title>
  <desc id="description">A read-only Windows viewer for huge text, wordlist, dictionary, and archived log files.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141d"/>
      <stop offset="1" stop-color="#202b3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#63d69a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="22" fill="url(#background)"/>
  <rect x="44" y="42" width="10" height="236" rx="5" fill="url(#accent)"/>
  <g transform="translate(92 62)">
    <text x="0" y="54" fill="#f3f6fb" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">WORDLIST &amp; LOG VIEWER</text>
    <text x="2" y="104" fill="#aeb9c9" font-family="Segoe UI, Arial, sans-serif" font-size="24">Huge text files. Fixed memory. Exact search.</text>
    <g transform="translate(2 142)" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      <rect width="160" height="38" rx="19" fill="#173a57"/>
      <text x="80" y="25" text-anchor="middle" fill="#8ccbff">300+ GB READY</text>
      <rect x="174" width="142" height="38" rx="19" fill="#193e2d"/>
      <text x="245" y="25" text-anchor="middle" fill="#87e7ad">READ ONLY</text>
      <rect x="330" width="184" height="38" rx="19" fill="#33304b"/>
      <text x="422" y="25" text-anchor="middle" fill="#c5baff">DISK-BACKED</text>
      <rect x="528" width="170" height="38" rx="19" fill="#433522"/>
      <text x="613" y="25" text-anchor="middle" fill="#f3c97d">6 LANGUAGES</text>
    </g>
  </g>
  <g transform="translate(1010 52)" fill="none" stroke="#78879b" stroke-width="3">
    <path d="M8 0h142l52 52v202H8z" fill="#151c27"/>
    <path d="M150 0v52h52"/>
    <path d="M39 91h130M39 124h130M39 157h95M39 190h118" stroke-linecap="round"/>
    <circle cx="39" cy="226" r="8" fill="#63d69a" stroke="none"/>
    <path d="M61 226h108" stroke="#58a6ff" stroke-linecap="round"/>
  </g>
</svg>

